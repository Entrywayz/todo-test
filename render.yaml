databases:
  - name: todo-db
    databaseName: todo_db
    user: postgres
    plan: free

services:
  # NestJS Backend
  - type: web
    name: todo-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: NODE_ENV
        value: production

  # Next.js Frontend
  - type: web
    name: todo-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Замените на URL вашего бэкенда после создания сервиса:
      # - key: NEXT_PUBLIC_API_URL
      #   value: https://todo-backend.onrender.com/api
